<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">Rahul & Shinjini | Bengali-Marwari Wedding Festivities</title>
    <meta
      id="page-description"
      name="description"
      content="Celebrate Rahul and Shinjini's fusion Bengali-Marwari wedding with a multi-day timeline of rituals and events."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Eczar:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="top-band" aria-hidden="true"></div>
    <div class="page-bg" aria-hidden="true"></div>

    <header class="hero container">
      <p class="eyebrow" id="hero-eyebrow">Wedding Schedule</p>
      <h1 id="hero-names"><span id="groom-name">Rahul</span> <span class="and-symbol">&amp;</span> <span id="bride-name">Shinjini</span></h1>
      <p class="subtitle" id="hero-subtitle">A joyful three-day Bengali-Marwari celebration with both families and friends.</p>

      <div class="filter-panel" aria-label="Timeline filters">
        <div class="filter-group">
          <p class="filter-label">Family Side</p>
          <div class="filter-buttons" id="side-filters">
            <button class="chip active" data-side="all">All Events</button>
            <button class="chip" data-side="groom">Groom Side</button>
            <button class="chip" data-side="bride">Bride Side</button>
            <button class="chip" data-side="both">Both Families</button>
          </div>
        </div>

        <div class="filter-group">
          <p class="filter-label">Day</p>
          <div class="filter-buttons" id="day-filters"></div>
        </div>
      </div>
      <div class="hero-ornament" aria-hidden="true"><span>✦ ✦ ✦</span></div>
    </header>

    <main class="container">
      <section class="timeline" id="timeline" aria-live="polite"></section>
    </main>

    <dialog id="ritual-modal" class="ritual-modal">
      <div class="modal-inner">
        <button class="modal-close" id="modal-close" aria-label="Close details">×</button>
        <p class="modal-side" id="modal-side"></p>
        <h2 id="modal-title"></h2>
        <p class="modal-time" id="modal-time"></p>
        <hr class="modal-divider" />
        <p class="modal-desc" id="modal-description"></p>
      </div>
    </dialog>

    <template id="event-card-template">
      <article class="event-card">
        <p class="event-time"></p>
        <h3 class="event-title"></h3>
        <div class="event-meta">
          <span class="event-side"></span>
          <span class="event-location"></span>
        </div>
        <button class="details-btn">View Ritual Details</button>
      </article>
    </template>

    <script src="script.js"></script>
  </body>
</html>
