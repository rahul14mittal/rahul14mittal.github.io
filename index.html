<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rahul & Shinjini - You're Invited</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,600&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="invite.css" />
</head>
<body>
  <div class="lang-selector">
    <select id="languageToggle" class="glass-select">
      <option value="en">English</option>
      <option value="hi">हिंदी</option>
      <option value="bn">বাংলা</option>
    </select>
  </div>
  <div class="bg-wrapper"></div>
  
  <div class="fireworks-container">
    <div class="firework f1"></div>
    <div class="firework f2"></div>
    <div class="firework f3"></div>
  </div>
  
  <div class="decorative-layer">
    <div class="city-landmark indore">
      <img src="data/rajwada.png" alt="Indore Rajwada" />
    </div>
    <div class="city-landmark kolkata">
      <img src="data/howrah.png" alt="Kolkata Howrah Bridge" />
    </div>
  </div>

  <main class="invite-container">
    <div class="glass-card" id="inviteCard">

      
      <div class="card-content">
        <p class="eyebrow fade-in" data-i18n="eyebrow">Together with their families</p>
        <h1 class="names reveal-text">
          <span class="name" data-i18n="groom">Rahul</span> 
          <span class="ampersand">&amp;</span> 
          <span class="name" data-i18n="bride">Shinjini</span>
        </h1>
        <p class="subtitle fade-in" data-i18n="subtitle">Invite you to celebrate their wedding</p>
        
        <div class="details fade-in delay-1">
          <div class="detail-item">
            <span class="icon">🗓️</span>
            <p data-i18n="date">December 11-12</p>
          </div>
          
          <div class="baarat-journey-inline">
            <img src="data/groom.png" alt="Groom" class="figurine groom" />
            <img src="data/bride.png" alt="Bride" class="figurine bride" />
          </div>

          <div class="detail-item">
            <span class="icon">📍</span>
            <p data-i18n="location">Kolkata, West Bengal</p>
          </div>
        </div>

        <div class="action-container fade-in delay-2">
          <a href="schedule.html" class="primary-btn">
            <span data-i18n="button">View the Itinerary</span>
            <span class="btn-arrow">→</span>
          </a>
        </div>
      </div>
    </div>
  </main>
  <script src="invite.js"></script>
</body>
</html>
