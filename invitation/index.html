<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Wedding Invitation | Rahul &amp; Shinjini #RahulKiJini</title>
  <meta name="description" content="You're invited to Rahul &amp; Shinjini's wedding — Dec 11-12, 2026, Kolkata. #RahulKiJini" />
  <meta property="og:title" content="Wedding Invitation | Rahul &amp; Shinjini" />
  <meta property="og:description" content="Join us to celebrate Rahul &amp; Shinjini's wedding. #RahulKiJini" />
  <meta property="og:url" content="https://rahulkijini.com/invitation/" />
  <link rel="icon" type="image/png" href="/wedding/assets/rs_monogram.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #invite-video {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      z-index: 1;
    }

    #unmute-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: max(env(safe-area-inset-bottom), 2rem);
      pointer-events: none;
    }

    #unmute-badge {
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: rgba(255,255,255,0.9);
      font-family: -apple-system, 'Segoe UI', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      padding: 0.55rem 1.2rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.15);
      margin-bottom: 2rem;
      opacity: 1;
      transition: opacity 0.6s ease;
    }

    #unmute-badge.hidden {
      opacity: 0;
    }

    #watermark {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 5;
      font-family: 'Georgia', serif;
      font-style: italic;
      font-size: 0.8rem;
      color: rgba(212,175,55,0.6);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <video
    id="invite-video"
    autoplay
    muted
    playsinline
    preload="auto"
    controls
  >
    <source src="/wedding/assets/invitation.mp4" type="video/mp4">
  </video>

  <div id="unmute-overlay">
    <div id="unmute-badge">🔇 Tap anywhere for sound</div>
  </div>

  <div id="watermark">#RahulKiJini</div>

  <script>
    const vid = document.getElementById('invite-video');
    const badge = document.getElementById('unmute-badge');

    const unlock = () => {
      vid.muted = false;

      const el = vid;
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.webkitEnterFullscreen) el.webkitEnterFullscreen();

      badge.classList.add('hidden');

      document.removeEventListener('click', unlock);
      document.removeEventListener('touchstart', unlock);
    };

    document.addEventListener('click', unlock);
    document.addEventListener('touchstart', unlock);

    setTimeout(() => badge.classList.add('hidden'), 5000);
  </script>

</body>
</html>
