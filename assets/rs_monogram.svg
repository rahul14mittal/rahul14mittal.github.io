<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ebd68a" />
      <stop offset="30%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa861c" />
      <stop offset="100%" stop-color="#f9f3d9" />
    </linearGradient>

    <!-- Crimson Red Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a81c24" />
      <stop offset="100%" stop-color="#660d13" />
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="#2b080c" />

  <g filter="url(#goldGlow)">
    
    <!-- Outer Connected Clean Heart Line -->
    <path d="M 250,430 
             C 120,340 50,250 50,160 
             C 50,85 110,40 185,40 
             C 225,40 245,65 250,80 
             C 255,65 275,40 315,40 
             C 390,40 450,85 450,160 
             C 450,250 380,340 250,430 Z" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Connecting Gold Swirls from Heart into Letters -->
    <path d="M 120,310 C 170,370 230,410 250,430 C 270,410 330,370 380,310" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="7" 
          stroke-linecap="round" />

    <!-- Letter R (Crimson Fill + Gold Border) -->
    <g>
      <!-- R Fill -->
      <path d="M 140,120 L 140,320 M 140,130 C 180,110 240,130 240,185 C 240,230 190,245 140,245 L 235,325" 
            fill="none" 
            stroke="url(#redGrad)" 
            stroke-width="26" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
      <!-- R Gold Border Outline -->
      <path d="M 140,120 L 140,320 M 140,130 C 180,110 240,130 240,185 C 240,230 190,245 140,245 L 235,325" 
            fill="none" 
            stroke="url(#goldGrad)" 
            stroke-width="30" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            style="mix-blend-mode: destination-over;" />
    </g>

    <!-- Intertwined Ampersand & Connection -->
    <path d="M 230,235 C 240,215 260,215 270,235 C 280,255 240,275 240,295 C 240,310 255,320 270,310" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="6" 
          stroke-linecap="round" />

    <!-- Letter S (Crimson Fill + Gold Border) -->
    <g>
      <!-- S Gold Border Outline (Back Layer) -->
      <path d="M 350,145 C 310,105 265,150 280,195 C 300,240 370,240 355,295 C 340,345 275,340 255,310" 
            fill="none" 
            stroke="url(#goldGrad)" 
            stroke-width="30" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
      <!-- S Red Fill -->
      <path d="M 350,145 C 310,105 265,150 280,195 C 300,240 370,240 355,295 C 340,345 275,340 255,310" 
            fill="none" 
            stroke="url(#redGrad)" 
            stroke-width="22" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
    </g>

    <!-- Top Connection Flourish -->
    <path d="M 250,80 C 240,110 220,120 180,120 M 250,80 C 260,110 280,120 320,120" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="5" 
          stroke-linecap="round" />
  </g>
</svg>
