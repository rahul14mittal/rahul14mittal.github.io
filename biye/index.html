<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P59LHG3TJX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-P59LHG3TJX');

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nimantran Patra | Shinjini & Rahul #RahulKiJini</title>
  <meta name="description" content="A special video for Shinjini & Rahul's wedding celebration. #RahulKiJini" />
  <meta property="og:title" content="Nimantran Patra | Shinjini & Rahul" />
  <meta property="og:description" content="A special video for Shinjini & Rahul's wedding. #RahulKiJini" />
  <meta property="og:url" content="https://rahulkijini.com/biye/" />
  <link rel="icon" type="image/png" href="/wedding/assets/rs_monogram.png" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0507;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
    }

    .bg-glow {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 30% 40%, rgba(152,27,34,0.2) 0%, transparent 60%),
                  radial-gradient(ellipse at 70% 70%, rgba(212,175,55,0.1) 0%, transparent 60%);
      pointer-events: none;
    }

    .header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2.5rem 1rem 1.5rem;
    }

    .logo {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid rgba(212,175,55,0.5);
      box-shadow: 0 0 25px rgba(212,175,55,0.2);
      margin-bottom: 1rem;
    }

    .title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      color: #d4af37;
      letter-spacing: 0.03em;
      margin-bottom: 0.3rem;
    }

    .subtitle {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    .divider {
      width: 50px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #d4af37, transparent);
      margin: 1.2rem auto;
    }

    /* Video player — portrait 9:16 */
    .video-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;   /* constrained on desktop */
      padding: 0 1rem;
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 177.78%;  /* 9:16 portrait ratio */
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        0 0 0 2px rgba(212,175,55,0.35),
        0 25px 60px rgba(0,0,0,0.85),
        0 0 50px rgba(212,175,55,0.08);
    }

    .video-container video {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: cover;
    }

    /* On small phones, use more of the screen width */
    @media (max-width: 480px) {
      .video-wrapper {
        max-width: 100%;
        padding: 0 0.5rem;
      }
      .video-container {
        border-radius: 14px;
      }
    }

    .footer-note {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 1.5rem 1rem 2.5rem;
      display: flex;
      align-items: center;
      gap: 1.2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .hashtag {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.1rem;
      color: rgba(212,175,55,0.6);
    }

    .back-link {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.25);
      text-decoration: none;
      letter-spacing: 0.1em;
      transition: color 0.2s;
    }

    .back-link:hover { color: rgba(255,255,255,0.5); }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <div class="header">
    <img src="/wedding/assets/rs_monogram.png" alt="RS Monogram" class="logo" />
    <h1 class="title">Shinjini &amp; Rahul</h1>
    <p class="subtitle">December 11–12, 2026 &nbsp;•&nbsp; Kolkata</p>
    <div class="divider"></div>
  </div>

  <div class="video-wrapper">
    <div class="video-container">
      <video
        id="biye-video"
        controls
        autoplay
        muted
        playsinline
        preload="auto"
      >
        <source src="wedding.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
  </div>

  <div class="footer-note">
    <span class="hashtag">#RahulKiJini</span>
  </div>

  <script>
    // Autoplay starts muted (browser requirement).
    // Unmute on first user interaction so sound plays naturally.
    const vid = document.getElementById('biye-video');
    const unmute = () => {
      vid.muted = false;
      document.removeEventListener('click', unmute);
      document.removeEventListener('touchstart', unmute);
    };
    document.addEventListener('click', unmute);
    document.addEventListener('touchstart', unmute);
  </script>

</body>
</html>
