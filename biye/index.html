    .bg-glow {

    }

    .card {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 90%;
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid rgba(212,175,55,0.5);
      box-shadow: 0 0 30px rgba(212,175,55,0.25);
      margin-bottom: 1.5rem;
    }

    .title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.2rem, 6vw, 3rem);
      color: #d4af37;
      margin-bottom: 0.3rem;
      letter-spacing: 0.03em;
    }

    .subtitle {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
    }

    .divider {
      width: 50px;
      height: 1px;

      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      background: linear-gradient(135deg, #9e1b22, #d4af37);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      padding: 1rem 2.2rem;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 8px 30px rgba(212,175,55,0.3), 0 0 0 1px rgba(212,175,55,0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-bottom: 1.5rem;

    .play-btn:hover {

      box-shadow: 0 14px 40px rgba(212,175,55,0.45), 0 0 0 1px rgba(212,175,55,0.3);

    .play-icon {
      width: 28px;
      height: 28px;

      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      padding-left: 2px;

    <p class="hashtag">#RahulKiJini</p>

  </div>

  <script>
    const target = 'https://canva.link/6eka3q0yctgzs7e';
    let n = 5;
    const el = document.getElementById('count');
    const timer = setInterval(() => {
      n--;
      el.textContent = n;
      if (n <= 0) {
        clearInterval(timer);
        window.location.href = target;
      }
    }, 1000);
  </script>
